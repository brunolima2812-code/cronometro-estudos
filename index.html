<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cronômetro — Estudos</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#191919;color:#b79aff;min-height:100vh;display:grid;place-items:center}.widget{width:min(100%,560px);padding:24px 20px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.2em;color:#b79aff;text-transform:uppercase;margin-bottom:14px}.time{font-size:clamp(42px,10vw,70px);font-weight:500;letter-spacing:.025em;font-variant-numeric:tabular-nums;line-height:1.25}.controls{display:flex;justify-content:center;gap:10px;margin-top:23px}button{background:#303030;border:1px solid #494949;color:#b79aff;border-radius:9px;padding:11px 20px;font:inherit;font-size:13px;cursor:pointer;min-width:100px}button.primary{background:#e5e5e5;color:#191919;border-color:#e5e5}button:hover{filter:brightness(1.13)}button:focus-visible{outline:2px solid #b79aff;outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}.note{font-size:11px;color:#777;margin-top:17px}@media(max-width:380px){.controls{gap:6px}button{min-width:0;padding:10px 14px}.widget{padding:16px 8px}}
</style></head><body><main class="widget"><div class="eyebrow">Estudos · Cronômetro</div><div class="time" id="display" role="timer" aria-label="Tempo decorrido">00:00:00</div><div class="controls"><button id="start" class="primary">Iniciar</button><button id="reset">Zerar</button></div><div class="note">O tempo fica salvo neste navegador.</div></main><script>
(()=>{'use strict';const key='estudos-stopwatch-v1',display=document.getElementById('display'),start=document.getElementById('start'),reset=document.getElementById('reset');let state={elapsed:0,running:false,startedAt:null};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Number.isFinite(saved.elapsed)&&saved.elapsed>=0&&typeof saved.running==='boolean'&&(!saved.running||Number.isFinite(saved.startedAt)))state=saved}catch{}const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};const elapsed=()=>Math.max(0,state.elapsed+(state.running?Math.max(0,Date.now()-state.startedAt):0));const render=()=>{const seconds=Math.floor(elapsed()/1000),h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;display.textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');start.textContent=state.running?'Pausar':state.elapsed?'Continuar':'Iniciar';reset.disabled=!state.running&&!state.elapsed};start.addEventListener('click',()=>{if(state.running){state.elapsed=elapsed();state.running=false;state.startedAt=null}else{state.running=true;state.startedAt=Date.now()}save();render()});reset.addEventListener('click',()=>{state={elapsed:0,running:false,startedAt:null};save();render()});render();setInterval(render,200);document.addEventListener('visibilitychange',render)})();
</script></body></html>
